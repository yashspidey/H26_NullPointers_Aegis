[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reporescue-ai"
version = "0.1.0"
description = "AI-powered repository maintenance agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "pydantic>=2",
    "rich",
    "requests",
    "toml",
    "pyyaml",
    "tomli",
    "packaging",
    "gitpython",
]

[project.optional-dependencies]
cognee = ["cognee"]
kestra = []  # Kestra runs as external orchestrator; no Python deps needed
streamlit = ["streamlit>=1.30"]
all = ["cognee", "streamlit"]

[project.scripts]
re-rescue = "reporescue.cli:cli"